# official/ 官网独立 CI：official/ 是 Spark 产品官网（独立 Next.js 15 项目，**不在 pnpm workspace**——
# 根 pnpm-workspace.yaml 的 packages 不含 official，亦无锁文件入库）。
# 本工作流独立于 ci.yml：install / lint / typecheck / build 四道静态门（WO-031 起 lint 入列），
# main push 时另起 deploy job 把静态导出产物发 GitHub Pages；
# 不触发产品端 eval / test / knip 等
# 任何步骤；official 构建失败不阻塞产品端 CI（ci.yml 无路径过滤照常全量跑，两路互不牵连）。
name: Official

on:
  push:
    branches: [main]
    paths:
      - 'official/**'
      - '.github/workflows/official.yml'
  pull_request:
    paths:
      - 'official/**'
      - '.github/workflows/official.yml'

# 并发取消：既有四个 workflow（ci/nightly/release/desktop-win）均未配 concurrency，无现成约定可抄；
# official 无锁文件、每次触发都要全量装依赖，同 ref 重复触发纯浪费——PR/push 新一轮直接取消旧一轮。
concurrency:
  group: official-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本以 package.json 的 packageManager 为唯一来源（同 ci.yml 纪律——读仓库根
        # pnpm@9.15.9；official/package.json 未声明 packageManager，故沿用根声明保证同版本）
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # 缓存 key 按根 pnpm-lock.yaml 计算（setup-node 默认依赖文件）；official 无锁文件，
          # store 内容寻址仍可部分命中，缓存 miss 仅损失加速、不影响正确性
      # official 无锁文件：--no-frozen-lockfile 允许安装时生成（生成物不入库）；
      # --ignore-workspace 防止 pnpm 向上找到仓库根 pnpm-workspace.yaml 而误装产品端全
      # workspace（pnpm ≥ 9.7 标志，根 packageManager 9.15.9 支持）。-C 指定目录跑
      # official/package.json 已声明的 scripts（同 nightly.yml `pnpm -C <dir>` 先例）。
      - run: pnpm -C official install --no-frozen-lockfile --ignore-workspace
      # WO-031：ESLint 接入（eslint.config.mjs flat config）——此前只有孤立
      # disable 注释而无本体；lint 是 next 语义的静态门，排在 typecheck 前
      - run: pnpm -C official lint
      - run: pnpm -C official typecheck
      # next build（next.config.ts output: "export" 静态导出至 official/out）
      - run: pnpm -C official build

  # 官网发布到 GitHub Pages 项目站（https://wanfeng1028.github.io/Spark/）。
  # 一次性人工前置：仓库 Settings → Pages → Source 选 "GitHub Actions"（或
  # `gh api -X POST /repos/Wanfeng1028/Spark/pages -f build_type=workflow`）；
  # 未启用时本 job 红在 deploy-pages 步，不影响 official 四道静态门、也不影响产品端 CI。
  # 槽位纪律：一个仓库只有一个 Pages 站，且 actions/deploy-pages 是**整站覆盖**——
  # 故 release.yml 的 docs job 已停发（官网先占 /Spark/，晚风 2026-09-24 拍板，WO-114）。
  # 需带 basePath：next.config.ts 里 basePath='/Spark'，否则 out/ 发出的 /_next/* 全 404。
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: official
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # 部署到 GitHub Pages
      id-token: write # actions/deploy-pages 的 OIDC
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Pages artifact 必须由持 pages 权限的 job 自己产出（跨 job 传不了），
      # 故此处重跑 install+build——official job 已在同一次运行里跑过，多花约 1 分钟换权限面收窄。
      - run: pnpm -C official install --no-frozen-lockfile --ignore-workspace
      - run: pnpm -C official build
      - id: pages
        uses: actions/configure-pages@v5
      # out/ 根含 official/public/.nojekyll（Next 自动拷入）——防 Jekyll 丢弃 _next/ 目录
      - uses: actions/upload-pages-artifact@v3
        with:
          path: official/out
      - uses: actions/deploy-pages@v4
