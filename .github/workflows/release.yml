# 发布流水线（工单 11.7）：push tag（v*）触发 → 校验 → 构建 → npm publish → GitHub Release；
# 另起一个 docs job 部署开发者文档站到 GitHub Pages（工单 14.6）。
# 发版纪律（版本策略/CHANGELOG 维护）见 CONTRIBUTING.md「发版」节；首发版本 v1.0.0（四包同版本：
# protocol/engine/sdk/cli——sdk 自工单 14.3 入发布集）。
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release 产物
      id-token: write # npm provenance（OIDC 签名；trust publishing 时可替代 NPM_TOKEN）
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本以 package.json 的 packageManager 为唯一来源（同 ci.yml 纪律）
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: python scripts/check_doc_links.py
      - run: pnpm typecheck
      - run: pnpm test
      - name: 构建（protocol/engine/sdk 产 dist+d.ts；cli 产 TUI bundle + server bundle）
        run: |
          pnpm --filter @spark/protocol build
          pnpm --filter @spark/engine build
          pnpm --filter @spark/sdk build
          pnpm --filter @spark/cli build
      # 认证二选一（CONTRIBUTING 发版节有操作说明）：
      #   A. NPM_TOKEN secret（当前默认）——npmjs 生成 publish token 配进仓库 secrets；
      #   B. npm Trusted Publishing（OIDC）——npmjs 配置 GitHub 工作流信任后，删除下方
      #      NODE_AUTH_TOKEN 环境即可（id-token: write 已就位）。
      - name: npm publish（四包同版本；private 包自动跳过）
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub Release（自动生成变更说明）
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # 开发者文档站（工单 14.6）：与 npm 发布同一个 tag 触发，但**单独一个 job**。
  # 理由：`environment: github-pages` 是 job 级配置（actions/deploy-pages 要求），
  # 若并进 publish job，一旦仓库给 Pages environment 配了审批/限制，npm 发布也会被卡住。
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # 部署到 GitHub Pages
      id-token: write # actions/deploy-pages 的 OIDC
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 发布前再校一次词表页与 schema 同步（与 ci.yml 同一口径：生成后不得有 diff）
      - run: pnpm --filter @spark/docs gen:events
      - run: git diff --exit-code apps/docs/events.md
      - name: 构建文档站（VitePress → apps/docs/.vitepress/dist；内置死链检查）
        run: pnpm --filter @spark/docs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist
      # 需仓库 Settings → Pages → Source 选 "GitHub Actions"（一次性人工设置）；
      # 未开启时本 job 失败，但不影响上面的 npm publish 与 GitHub Release。
      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
