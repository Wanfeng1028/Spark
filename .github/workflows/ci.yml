name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本以 package.json 的 packageManager 为唯一来源（此处不写 version，
        # 避免与 packageManager 双重声明触发 ERR_PNPM_BAD_PM_VERSION）
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/check_doc_links.py
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
