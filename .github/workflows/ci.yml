name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本以 package.json 的 packageManager 为唯一来源（此处不写 version，
        # 避免与 packageManager 双重声明触发 ERR_PNPM_BAD_PM_VERSION）
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/check_doc_links.py
      - run: pnpm typecheck
      - run: pnpm lint
      # 工单 14.1 第二批（ARCHITECTURE §9.6 "未引用导出/依赖"硬检查项）：knip 扫描。
      # 单独一步而不并进 `pnpm lint`：两个工具的报告形状与失败语义不同，合在一起会让
      # eslint 的红灯被 knip 噪声掩盖；同样是硬门（非零退出即红）。裁决表见 doc/02 §4.6.3。
      - run: pnpm knip
      # 工单 14.2：契约生成物与 schema 同步门禁——重跑生成器后 diff 必须为空。
      # 改了 zod schema 却不重生成 → 这里红（doc/06 §1 契约层、doc/08 §14.2 验收第 2 条）。
      - run: pnpm --filter @spark/protocol gen:contract
      - run: git diff --exit-code packages/protocol/tests/contract
      # 工单 14.6：文档站的事件词表页同一口径——它也是从 zod schema 生成的，
      # 改了词表却不重生成 → 这里红（生成器：apps/docs/scripts/gen-events.ts）。
      - run: pnpm --filter @spark/docs gen:events
      - run: git diff --exit-code apps/docs/events.md
      # 工单 15.2：OpenAPI 导出同一口径——路由元数据（packages/protocol/src/openapi-routes.ts）
      # 与 DTO schema 合成 openapi.json，改了路由/schema 却不重生成 → 这里红。
      # 生成器内置结构自检（responses 完备/$ref 可解析/路径参数声明），自检不过生成器直接退出 1。
      - run: pnpm --filter @spark/protocol gen:openapi
      - run: git diff --exit-code packages/protocol/openapi.json
      - run: pnpm test
      # 工单 13.1 第三批（doc/08 §13.1 验收第 1 条、提示词第 4 条："CI（非 nightly）用 ScriptedLlm 冒烟"）：
      # core 四场景 + 任务级判分双向自检 13 场景，无 key 无网络（约 10s）
      - run: pnpm eval
      # 工单 14.1 第三批补的洞：**声明发射回归在 CI 里原本是隐形的**——`pnpm typecheck` 是
      # `tsc --noEmit`，不会报 TS4033/TS4023（"exported interface has or is using private name"），
      # 而 engine/protocol 发布靠 `tsconfig.build.json`（declaration: true）。把符号降为私有时
      # 若它出现在同文件已导出类型的字段位置，只会在 release/desktop 打包时炸。
      # 放最后一步：先把其余信号全部收齐，不让构建失败掩盖测试结果。
      - run: pnpm -r build

  # 工单 11.3（doc/06 §2 目标表 PR 行）：PR/push 上的浏览器测试——mock 四场景 + 断线两例。
  # 与主 ci job 并行，失败即红；不跑视觉基线断言（用例本身只产出截图，无跨平台 diff）。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本以 package.json 的 packageManager 为唯一来源（同主 job）
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GitHub runner 可直连 Playwright 官方 CDN——不设 SPARK_E2E_BROWSER
      # （该兜底留给本地沙箱网络受限环境，见 apps/web/playwright.config.ts 与 doc/06 v1.1）
      # **不加 `--with-deps`**：它会跑 `apt-get update`，而 runner 镜像预置的
      # dl.google.com/linux/chrome-stable 仓库索引哈希不匹配（上游镜像同步问题，与本仓代码无关），
      # 会让本步失败、e2e 用例一个没跑。ubuntu 镜像已带 chromium 所需系统库，故只装浏览器本体；
      # 若真缺库，e2e 会报明确的 missing dependency，届时按需装具体那几个库（不做全量 update）。
      - run: pnpm --filter @spark/web exec playwright install chromium
      - run: pnpm --filter @spark/web e2e
