# 工单 9.3 Maestro 用例①：正常发消息（只入库不执行——真机走查由用户做）
# 依据：doc/06-testing-plan.md §1 分层表 L5 行（移动端 E2E 用 Maestro，YAML 入库 apps/mobile/e2e/）
# 运行：已装 Maestro（https://maestro.mobile.dev）+ 已配对可连的 Spark server + 已安装构建包后
#   maestro test apps/mobile/e2e/send-message.yaml
appId: com.sparkapp.mobile
---
- launchApp:
    clearState: false
# 首页会话列表就绪（J.2.2）
- assertVisible: "全部会话"
# 进入任一已有会话（列表首行）
- tapOn:
    text: ".*"
    index: 1
# 会话页就绪：输入框与发送钮在场（J.2.3 Composer）
- assertVisible: "消息输入框"
- assertVisible: "发送消息"
# 输入任务文案并发送
- tapOn: "消息输入框"
- inputText: "Maestro 冒烟：请回复收到"
- tapOn: "发送消息"
# user 胶囊即时呈现（发送后清空输入）
- assertVisible: "Maestro 冒烟：请回复收到"
# 等待 assistant 应答呈现（含合规标注，J.2.3 操作行）
- extendedWaitUntil:
    visible: "内容由 AI 生成"
    timeout: 60000
