<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spark SDK · 最小 viewer</title>
    <style>
      /* DESIGN 红线（§12 反 AI 味 + §13.C 密度子集）：中性黑白、13px 体系、细线分隔，
         无渐变 / 无阴影 / 无毛玻璃 / 无 emoji / 无超大标题。
         刻意不引 Tailwind 工具链：150 行的示例不该变成配置展，同值的 CSS 变量子集够用
         （口径偏离已在 doc/08 §14.5 登记）。 */
      :root {
        --bg: #ffffff;
        --fg: #111111;
        --muted: #6b6b6b;
        --line: #e4e4e4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #ededed;
          --muted: #9a9a9a;
          --line: #2a2a2a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.6 ui-sans-serif,
          system-ui,
          'Segoe UI',
          sans-serif;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }
      select {
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 6px;
      }
      main {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .row {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 6px 8px;
        white-space: pre-wrap;
      }
      .who {
        color: var(--muted);
        margin-right: 6px;
      }
      .muted {
        color: var(--muted);
      }
      .approval {
        border-left: 2px solid var(--fg);
      }
      .turn {
        border: 0;
        padding: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Spark · 最小 viewer</strong>
      <select id="picker" aria-label="选择会话"></select>
      <span id="status" class="muted">连接中…</span>
    </header>
    <main id="stream"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
