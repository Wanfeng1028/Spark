<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Terminal background -->
  <rect width="800" height="600" fill="#18181b" rx="6"/>

  <!-- Terminal title bar -->
  <rect x="0" y="0" width="800" height="32" rx="6" fill="#27272a"/>
  <rect x="0" y="26" width="800" height="6" fill="#27272a"/>
  <circle cx="20" cy="16" r="5" fill="#3f3f46"/>
  <circle cx="38" cy="16" r="5" fill="#3f3f46"/>
  <circle cx="56" cy="16" r="5" fill="#3f3f46"/>
  <text x="400" y="20" font-family="monospace" font-size="11" fill="#71717a" text-anchor="middle">spark — zsh</text>

  <!-- TUI content area -->
  <!-- Session header -->
  <text x="24" y="64" font-family="monospace" font-size="12" fill="#a1a1aa">~/projects/my-app</text>
  <rect x="24" y="72" width="752" height="1" fill="#3f3f46"/>

  <!-- Conversation lines -->
  <text x="24" y="100" font-family="monospace" font-size="11" fill="#e4e4e7">user: refactor the auth module</text>

  <text x="24" y="128" font-family="monospace" font-size="11" fill="#71717a">assistant:</text>
  <text x="24" y="146" font-family="monospace" font-size="11" fill="#a1a1aa">I'll read the current auth implementation first.</text>

  <!-- Tool call indicator -->
  <rect x="24" y="164" width="752" height="48" rx="3" fill="#27272a"/>
  <text x="40" y="184" font-family="monospace" font-size="10" fill="#71717a">tool:read_file</text>
  <text x="40" y="200" font-family="monospace" font-size="10" fill="#3f3f46">src/auth/session.ts (142 lines)</text>

  <!-- Approval prompt -->
  <rect x="24" y="224" width="752" height="64" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="40" y="248" font-family="monospace" font-size="11" fill="#e4e4e7">tool:write_file src/auth/session.ts</text>
  <text x="40" y="268" font-family="monospace" font-size="10" fill="#71717a">[1] allow once  [2] always  [3] deny</text>
  <rect x="40" y="276" width="8" height="2" fill="#a1a1aa"/>

  <!-- Status bar -->
  <rect x="0" y="560" width="800" height="40" fill="#27272a"/>
  <text x="24" y="584" font-family="monospace" font-size="10" fill="#71717a">tokens: 4.2k / 128k</text>
  <text x="300" y="584" font-family="monospace" font-size="10" fill="#3f3f46">|</text>
  <text x="320" y="584" font-family="monospace" font-size="10" fill="#71717a">model: deepseek-chat</text>
  <text x="700" y="584" font-family="monospace" font-size="10" fill="#3f3f46">Ctrl+C quit</text>

  <!-- Label -->
  <text x="400" y="440" font-family="system-ui, sans-serif" font-size="24" fill="#71717a" text-anchor="middle" font-weight="600">Spark CLI</text>
  <text x="400" y="468" font-family="system-ui, sans-serif" font-size="12" fill="#3f3f46" text-anchor="middle">Ink 7 — single-column TUI</text>
</svg>
