  <text x="314" y="428" font-family="monospace" font-size="9" fill="#71717a">allow</text>
  <text x="410" y="428" font-family="monospace" font-size="9" fill="#71717a">deny</text>

  <!-- More messages -->
  <rect x="290" y="460" width="380" height="48" rx="6" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="306" y="476" width="240" height="8" rx="2" fill="#a1a1aa"/>
  <rect x="306" y="492" width="160" height="8" rx="2" fill="#e4e4e7"/>

