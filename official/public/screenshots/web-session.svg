  <text x="82" y="705" font-family="system-ui,sans-serif" font-size="12" fill="#18181b">晚风</text>
  <text x="82" y="719" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">本地会话</text>

  <!-- 会话内容列 768px 居中（主区 270..1170） -->
