  <rect x="808" y="92" width="296" height="38" rx="19" fill="#edf3fe"/>
  <text x="824" y="116" font-family="system-ui,sans-serif" font-size="13" fill="#27272a">把 bash 工具改成持久进程池，别每次冷启动</text>

  <text x="336" y="166" font-family="system-ui,sans-serif" font-size="14" fill="#27272a">好。先读现有实现和测试，再列改动点。</text>

  <!-- 工具执行块（可折叠行） -->
  <rect x="336" y="192" width="768" height="34" rx="8" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="352" y="214" font-family="ui-monospace,Consolas,monospace" font-size="12"><tspan fill="#18181b" font-weight="600">▸ bash</tspan><tspan fill="#71717a" dx="10">pnpm --filter @spark/engine test</tspan></text>
  <text x="1088" y="214" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#047857" text-anchor="end">✓ 12.4s</text>

  <rect x="336" y="234" width="768" height="34" rx="8" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="352" y="256" font-family="ui-monospace,Consolas,monospace" font-size="12"><tspan fill="#18181b" font-weight="600">▸ read</tspan><tspan fill="#71717a" dx="10">packages/engine/src/tools/builtin/bash.ts</tspan></text>
  <text x="1088" y="256" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#047857" text-anchor="end">✓ 0.3s</text>

  <rect x="336" y="276" width="768" height="34" rx="8" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="352" y="298" font-family="ui-monospace,Consolas,monospace" font-size="12"><tspan fill="#18181b" font-weight="600">▸ grep</tspan><tspan fill="#71717a" dx="10">"spawn" in src/tools</tspan></text>
  <text x="1088" y="298" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#047857" text-anchor="end">✓ 0.1s</text>

  <text x="336" y="350" font-family="system-ui,sans-serif" font-size="14" fill="#27272a">改动集中在三处：worker 生命周期、池化调度、超时回收。提交前先跑一遍全量测试。</text>

  <!-- 审批卡：warn 语义左条 + 三值答复（§13.L 语义左边框豁免） -->
  <rect x="336" y="372" width="768" height="138" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="337" y="373" width="3" height="136" rx="1.5" fill="#b45309"/>
  <text x="360" y="400" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#18181b">bash 想要执行命令</text>
  <text x="360" y="418" font-family="system-ui,sans-serif" font-size="11" fill="#71717a">写入类操作需要确认 · 超时未答复将自动拒绝（fail-closed）</text>
  <rect x="360" y="430" width="720" height="28" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="372" y="448" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#3f3f46">git add -A &amp;&amp; git commit -m "feat: bash 持久进程池"</text>
  <rect x="360" y="472" width="84" height="28" rx="14" fill="#18181b"/>
  <text x="402" y="490" font-family="system-ui,sans-serif" font-size="11" fill="#fafafa" text-anchor="middle">批准一次</text>
  <rect x="452" y="472" width="84" height="28" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
  <text x="494" y="490" font-family="system-ui,sans-serif" font-size="11" fill="#3f3f46" text-anchor="middle">总是允许</text>
  <rect x="544" y="472" width="68" height="28" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
  <text x="578" y="490" font-family="system-ui,sans-serif" font-size="11" fill="#3f3f46" text-anchor="middle">拒绝</text>

  <text x="336" y="548" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#a1a1aa">⏸ 等待你的答复 · 回复只有 once / always / reject 三种</text>

  <!-- Composer 胶囊（§13.L 22px 档） + 发送钮 -->
  <rect x="336" y="676" width="768" height="56" rx="22" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
  <text x="364" y="710" font-family="system-ui,sans-serif" font-size="13" fill="#a1a1aa">输入消息，/ 唤起命令 · @ 引用文件</text>
  <circle cx="1072" cy="704" r="16" fill="#4f46e5"/>
  <path d="M1066 704 h11 M1073 700 l4.5 4 -4.5 4" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

