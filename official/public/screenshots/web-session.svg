  -->
  <rect width="1200" height="800" fill="#f4f4f5"/>

  <!-- 窗口 -->
  <rect x="30" y="24" width="1140" height="752" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>

