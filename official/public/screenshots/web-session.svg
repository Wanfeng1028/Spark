    - 三栏骨架/密度：DESIGN §13.A（侧栏 240 级、会话内容列 768 居中、顶栏 44、StatusBar 24）
    - user 气泡 #edf3fe：DESIGN §13.L（--user-bubble 浅色值）
    - 审批卡 warn 左条 + once/always/reject：DESIGN §8/§13.L（语义左边框豁免）
    - Composer 胶囊 22px 档、发送钮 accent：DESIGN §13.B/§13.L
