  <path d="M1066 704 h11 M1073 700 l4.5 4 -4.5 4" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- StatusBar -->
  <line x1="40" y1="748" x2="1160" y2="748" stroke="#e4e4e7" stroke-width="1"/>
