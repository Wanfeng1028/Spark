<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!--
    高保真产品 mock（Electron 桌面壳，展示工具调用可视化）。
    事实可回源码核对（DESIGN §5 禁假状态）：
    - 锁文件纪律实例：AGENTS.md §2.2（并行会话 lockfile 污染 → 干净 worktree 重算后拷回）
    - 工具块字段：tool.started { input } / tool.completed { output, isError, durationMs }（packages/protocol/src/events.ts）
    - 127.0.0.1:4318：packages/engine/src/config.ts SPARK_DEFAULTS
  -->
  <rect width="1200" height="800" fill="#e4e4e7"/>

  <!-- 窗口 + 标题栏 -->
  <rect x="40" y="28" width="1120" height="744" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <circle cx="66" cy="48" r="5" fill="#d4d4d8"/>
  <circle cx="86" cy="48" r="5" fill="#d4d4d8"/>
  <circle cx="106" cy="48" r="5" fill="#d4d4d8"/>
  <text x="600" y="52" font-family="system-ui,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#71717a" text-anchor="middle">Spark — 桌面壳（Electron sidecar）</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#e4e4e7" stroke-width="1"/>

  <!-- 左栏 -->
  <rect x="40" y="68" width="240" height="680" fill="#fafafa"/>
  <line x1="280" y1="68" x2="280" y2="748" stroke="#e4e4e7" stroke-width="1"/>
  <text x="64" y="100" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#18181b">Spark</text>
  <rect x="56" y="114" width="208" height="30" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="68" y="133" font-family="system-ui,sans-serif" font-size="12" fill="#52525b">＋ 新建任务</text>
