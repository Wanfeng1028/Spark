  <rect x="872" y="78" width="64" height="24" rx="12" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <text x="904" y="94" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#52525b" text-anchor="middle">Spark</text>
  <rect x="944" y="78" width="56" height="24" rx="12" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <text x="972" y="94" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#52525b" text-anchor="middle">main</text>

  <!-- 会话内容列 768px 居中（主区 280..1160 → 列 336..1104） -->
  <rect x="714" y="132" width="390" height="38" rx="19" fill="#edf3fe"/>
  <text x="730" y="156" font-family="system-ui,sans-serif" font-size="13" fill="#27272a">pnpm install 报 ERR_PNPM_OUTDATED_LOCKFILE，CI 全红</text>

  <text x="336" y="206" font-family="system-ui,sans-serif" font-size="14" fill="#27272a">先看锁文件 diff 里混进了谁的依赖。</text>

  <rect x="336" y="228" width="768" height="34" rx="8" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="352" y="250" font-family="ui-monospace,Consolas,monospace" font-size="12"><tspan fill="#18181b" font-weight="600">▸ bash</tspan><tspan fill="#71717a" dx="10">git diff HEAD -- pnpm-lock.yaml</tspan></text>
  <text x="1088" y="250" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#047857" text-anchor="end">✓ 1.1s</text>

  <!-- 展开的工具输出块（深色代码区） -->
  <rect x="336" y="278" width="768" height="170" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="352" y="300" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#71717a">bash · 输出</text>
  <text x="1088" y="300" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#047857" text-anchor="end">exit 0 · 1.1s</text>
  <rect x="337" y="308" width="766" height="139" rx="7" fill="#18181b"/>
  <text x="354" y="332" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#34d399">+ miniapp h5: react-dom@19.1.0</text>
  <text x="354" y="356" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#34d399">+ mobile web: metro-resolver@0.82.4</text>
  <text x="354" y="392" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#a1a1aa">lockfile 含并行会话未提交的 package.json 依赖</text>
  <text x="354" y="416" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#a1a1aa">→ 用干净 worktree 重算后拷回（AGENTS §2.2）</text>
  <text x="354" y="440" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#fbbf24">不得 checkout / stash 别人的在制品</text>

  <text x="336" y="486" font-family="system-ui,sans-serif" font-size="14" fill="#27272a">确认了：不是本次改动。我取干净检出重算锁文件，然后提交修复。</text>

  <!-- 审批卡（等待中） -->
  <rect x="336" y="508" width="768" height="138" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="337" y="509" width="3" height="136" rx="1.5" fill="#b45309"/>
  <text x="360" y="536" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#18181b">bash 想要执行命令</text>
  <text x="360" y="554" font-family="system-ui,sans-serif" font-size="11" fill="#71717a">写入类操作需要确认 · 超时未答复将自动拒绝（fail-closed）</text>
  <rect x="360" y="566" width="720" height="28" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="372" y="584" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#3f3f46">git add pnpm-lock.yaml &amp;&amp; git commit -m "fix: 重算锁文件"</text>
  <rect x="360" y="608" width="84" height="28" rx="14" fill="#18181b"/>
  <text x="402" y="626" font-family="system-ui,sans-serif" font-size="11" fill="#fafafa" text-anchor="middle">批准一次</text>
  <rect x="452" y="608" width="84" height="28" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
  <text x="494" y="626" font-family="system-ui,sans-serif" font-size="11" fill="#3f3f46" text-anchor="middle">总是允许</text>
  <rect x="544" y="608" width="68" height="28" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
  <text x="578" y="626" font-family="system-ui,sans-serif" font-size="11" fill="#3f3f46" text-anchor="middle">拒绝</text>

  <!-- Composer -->
  <rect x="336" y="676" width="768" height="56" rx="22" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
