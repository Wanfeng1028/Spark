<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <!-- Phone frame -->
  <rect width="400" height="800" fill="#f4f4f5"/>
  <rect x="16" y="16" width="368" height="768" rx="32" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>

  <!-- Status bar -->
  <rect x="16" y="16" width="368" height="44" rx="32" fill="#f4f4f5"/>
  <text x="200" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#71717a" text-anchor="middle">9:41</text>
  <!-- Notch -->
  <rect x="148" y="18" width="104" height="24" rx="12" fill="#e4e4e7"/>

  <!-- Header -->
  <rect x="16" y="60" width="368" height="48" fill="#ffffff" stroke="#e4e4e7" stroke-width="0.5"/>
  <text x="200" y="90" font-family="system-ui, sans-serif" font-size="14" fill="#71717a" text-anchor="middle" font-weight="500">Spark Session</text>

  <!-- Chat messages -->
  <!-- User message -->
  <rect x="100" y="130" width="260" height="44" rx="16" fill="#e4e4e7"/>
  <rect x="116" y="146" width="180" height="8" rx="2" fill="#71717a"/>

  <!-- Assistant message -->
  <rect x="40" y="192" width="280" height="72" rx="16" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="60" y="210" width="200" height="8" rx="2" fill="#a1a1aa"/>
  <rect x="60" y="226" width="160" height="8" rx="2" fill="#e4e4e7"/>
  <rect x="60" y="242" width="220" height="8" rx="2" fill="#e4e4e7"/>

  <!-- Tool call card -->
  <rect x="40" y="284" width="320" height="80" rx="12" fill="#ffffff" stroke="#a1a1aa" stroke-width="1.5"/>
  <rect x="60" y="302" width="100" height="8" rx="2" fill="#71717a"/>
  <rect x="60" y="320" width="260" height="24" rx="4" fill="#f4f4f5"/>
  <text x="72" y="336" font-family="monospace" font-size="9" fill="#a1a1aa">read_file: package.json</text>

  <!-- Approval card -->
  <rect x="40" y="384" width="320" height="60" rx="12" fill="#ffffff" stroke="#71717a" stroke-width="2"/>
  <rect x="60" y="400" width="160" height="8" rx="2" fill="#71717a"/>
  <rect x="60" y="420" width="64" height="16" rx="8" fill="#e4e4e7"/>
  <rect x="136" y="420" width="64" height="16" rx="8" fill="#e4e4e7"/>
  <text x="72" y="432" font-family="monospace" font-size="8" fill="#71717a">Allow</text>
  <text x="152" y="432" font-family="monospace" font-size="8" fill="#71717a">Deny</text>

  <!-- Another message -->
  <rect x="40" y="464" width="240" height="52" rx="16" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="60" y="480" width="180" height="8" rx="2" fill="#a1a1aa"/>
  <rect x="60" y="496" width="120" height="8" rx="2" fill="#e4e4e7"/>

  <!-- Input area -->
  <rect x="16" y="700" width="368" height="84" rx="0" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="40" y="720" width="280" height="40" rx="20" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="60" y="736" width="100" height="8" rx="2" fill="#e4e4e7"/>
  <!-- Send button -->
  <circle cx="344" cy="740" r="16" fill="#e4e4e7"/>
  <path d="M338 740 L350 740 M346 735 L351 740 L346 745" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Label -->
  <text x="200" y="620" font-family="system-ui, sans-serif" font-size="22" fill="#71717a" text-anchor="middle" font-weight="600">Spark Mobile</text>
  <text x="200" y="648" font-family="system-ui, sans-serif" font-size="11" fill="#a1a1aa" text-anchor="middle">Expo + React Native</text>
</svg>
