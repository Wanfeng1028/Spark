<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <!--
    高保真产品 mock（Expo + RN 移动端，展示移动审批体验）。
    事实可回源码核对（DESIGN §5 禁假状态）：
    - 配对鉴权（6 位短码换长效 token）：ADR D24 / apps/mobile
    - 审批三值 once / always / reject + fail-closed：packages/engine/src/permission/service.ts
    - user 气泡 #edf3fe：DESIGN §13.L
  -->
  <rect width="400" height="800" fill="#f4f4f5"/>

  <!-- 机身 -->
  <rect x="56" y="24" width="288" height="752" rx="44" fill="#09090b"/>
  <rect x="62" y="30" width="276" height="740" rx="38" fill="#ffffff"/>

  <!-- 状态栏 -->
  <text x="100" y="57" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#18181b">9:41</text>
  <text x="286" y="57" font-family="system-ui,sans-serif" font-size="9" fill="#18181b" text-anchor="end">5G</text>
  <rect x="294" y="47" width="20" height="10" rx="2.5" fill="none" stroke="#18181b" stroke-width="1.2"/>
  <rect x="296" y="49" width="12" height="6" rx="1" fill="#18181b"/>
  <rect x="315" y="50.5" width="1.5" height="3" rx="0.75" fill="#18181b"/>

  <!-- 应用栏 -->
  <line x1="62" y1="72" x2="338" y2="72" stroke="#f4f4f5" stroke-width="1"/>
  <text x="88" y="99" font-family="system-ui,sans-serif" font-size="17" fill="#18181b">‹</text>
  <text x="106" y="97" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#18181b">bash 工具持久进程池</text>
  <text x="320" y="98" font-family="system-ui,sans-serif" font-size="13" fill="#71717a" text-anchor="end">⋯</text>
  <line x1="62" y1="112" x2="338" y2="112" stroke="#f4f4f5" stroke-width="1"/>

  <!-- 会话流（内边距 16 → 列 78..322） -->
  <rect x="146" y="128" width="176" height="34" rx="17" fill="#edf3fe"/>
  <text x="158" y="149" font-family="system-ui,sans-serif" font-size="12" fill="#27272a">把 bash 工具改成持久进程池</text>

  <text x="78" y="192" font-family="system-ui,sans-serif" font-size="13" fill="#27272a">好。先读实现，再列改动点。</text>

  <rect x="78" y="208" width="244" height="28" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="88" y="226" font-family="ui-monospace,Consolas,monospace" font-size="11"><tspan fill="#18181b" font-weight="600">▸ bash</tspan><tspan fill="#71717a" dx="8">pnpm test</tspan></text>
  <text x="314" y="226" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#047857" text-anchor="end">✓ 12.4s</text>

  <!-- 审批卡 -->
  <rect x="78" y="248" width="244" height="172" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="79" y="249" width="3" height="170" rx="1.5" fill="#b45309"/>
  <text x="96" y="274" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#18181b">bash 想要执行命令</text>
  <text x="96" y="291" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">超时未答复将自动拒绝</text>
  <rect x="96" y="300" width="210" height="24" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="104" y="316" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#3f3f46">git commit -m "feat: bash 池"</text>
  <rect x="96" y="334" width="210" height="30" rx="15" fill="#18181b"/>
  <text x="201" y="353" font-family="system-ui,sans-serif" font-size="11" fill="#fafafa" text-anchor="middle">批准一次</text>
  <rect x="96" y="372" width="101" height="28" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
  <text x="146" y="390" font-family="system-ui,sans-serif" font-size="11" fill="#3f3f46" text-anchor="middle">总是允许</text>
  <rect x="205" y="372" width="101" height="28" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
  <text x="255" y="390" font-family="system-ui,sans-serif" font-size="11" fill="#3f3f46" text-anchor="middle">拒绝</text>

  <text x="78" y="450" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#a1a1aa">… 等待你的答复</text>

  <!-- 连接提示行（移动端配对语义） -->
  <rect x="78" y="486" width="244" height="52" rx="12" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <circle cx="98" cy="512" r="4" fill="#047857"/>
  <text x="112" y="508" font-family="system-ui,sans-serif" font-size="11" fill="#52525b">已配对 · 127.0.0.1:4318</text>
  <text x="112" y="524" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">会话与桌面端实时同步</text>

  <!-- Composer -->
  <rect x="78" y="686" width="244" height="40" rx="20" fill="#ffffff" stroke="#d4d4d8" stroke-width="1"/>
  <text x="94" y="710" font-family="system-ui,sans-serif" font-size="12" fill="#a1a1aa">输入消息…</text>
  <circle cx="304" cy="706" r="14" fill="#4f46e5"/>
  <path d="M299 706 h9 M305 702.5 l3.5 3.5 -3.5 3.5" fill="none" stroke="#fafafa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Home 指示条 -->
  <rect x="160" y="758" width="80" height="4" rx="2" fill="#d4d4d8"/>
</svg>
